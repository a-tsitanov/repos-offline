[project]
name = "offpack"
version = "0.1.0"
description = "Перенос npm/PyPI-пакетов в офлайн-Nexus через песочницу"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
offpack = "offpack.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/offpack"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: нужны docker и интернет",
    "nexus: e2e с контейнером Nexus, запускать вручную",
]
addopts = "-m 'not docker and not nexus'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
